name: 🍎 macOS Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    "accesskit_sdk_path=${{ github.workspace }}/accesskit-c-0.21.2/"

jobs:
  build-macos:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-latest
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor)
            cache-name: macos-editor
            target: editor
            bin: ./bin/godot.macos.editor.universal

          - name: Template (target=template_release)
            cache-name: macos-template
            target: template_release
            scons-flags: debug_symbols=no
            bin: ./bin/godot.macos.template_release.universal

          - name: Editor with doubles (target=editor, precision=double)
            cache-name: macos-editor-double
            target: editor
            scons-flags: precision=double
            precision-suffix: .double
            bin: ./bin/godot.macos.editor.double.universal

          - name: Template with doubles (target=template_release, precision=double)
            cache-name: macos-template-double
            target: template_release
            scons-flags: debug_symbols=no precision=double
            precision-suffix: .double
            bin: ./bin/godot.macos.template_release.double.universal

          - name: Editor w/ Mono and doubles (target=editor, module_mono_enabled=yes, precision=double)
            cache-name: macos-editor-mono-double
            target: editor
            scons-flags: module_mono_enabled=yes precision=double
            precision-suffix: .double
            mono-suffix: .mono
            bin: ./bin/godot.macos.editor.double.universal.mono
            build-mono: true
            dotnet-version: 10.0.x
            mono-build-args: --precision=double --no-deprecated --push-nupkgs-local=./bin/nupkgs

          - name: Template w/ Mono and doubles, release (target=template_release, module_mono_enabled=yes, precision=double)
            cache-name: macos-template-mono-double
            target: template_release
            scons-flags: debug_symbols=no module_mono_enabled=yes precision=double
            precision-suffix: .double
            mono-suffix: .mono
            bin: ./bin/godot.macos.template_release.double.universal.mono

          - name: Template w/ Mono and doubles, debug (target=template_debug, module_mono_enabled=yes, precision=double)
            cache-name: macos-template-mono-double-debug
            target: template_debug
            scons-flags: debug_symbols=no module_mono_enabled=yes precision=double
            precision-suffix: .double
            mono-suffix: .mono
            bin: ./bin/godot.macos.template_debug.double.universal.mono

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # From https://github.com/actions/runner-images/blob/main/images/macos
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built AccessKit
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-accesskit-c-static
          version: tags/0.21.2
          file: accesskit-c-0.21.2.zip
          target: accesskit-c-0.21.2/accesskit_c.zip

      - name: Extract pre-built AccessKit
        run: unzip -o accesskit-c-0.21.2/accesskit_c.zip

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Setup .NET SDK
        if: matrix.build-mono
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Compilation (x86_64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} arch=x86_64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
          platform: macos
          target: ${{ matrix.target }}

      - name: Compilation (arm64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} arch=arm64 vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
          platform: macos
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Create universal binary
        run: |
          lipo -create ./bin/godot.macos.${{ matrix.target }}${{ matrix.precision-suffix }}.x86_64${{ matrix.mono-suffix }} ./bin/godot.macos.${{ matrix.target }}${{ matrix.precision-suffix }}.arm64${{ matrix.mono-suffix }} -output ./bin/godot.macos.${{ matrix.target }}${{ matrix.precision-suffix }}.universal${{ matrix.mono-suffix }}
          rm ./bin/godot.macos.${{ matrix.target }}${{ matrix.precision-suffix }}.x86_64${{ matrix.mono-suffix }} ./bin/godot.macos.${{ matrix.target }}${{ matrix.precision-suffix }}.arm64${{ matrix.mono-suffix }}
          chmod +x ${{ matrix.bin }}

      - name: Generate C# glue
        if: matrix.build-mono
        run: |
          ${{ matrix.bin }} --headless --generate-mono-glue ./modules/mono/glue

      - name: Build .NET solutions
        if: matrix.build-mono
        run: |
          dotnet --info
          ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=macos --werror ${{ matrix.mono-build-args }}

      - name: Prepare artifact
        run: |
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Unit tests
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
          ${{ matrix.bin }} --test --force-colors
